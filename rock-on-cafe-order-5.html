<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock On Café — Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c;
    --bg-alt:#151517;
    --card:#1a1a1d;
    --gold:#3b78f0;
    --gold-bright:#7aa4ff;
    --orange:#f0960a;
    --cream:#f4ecdb;
    --dim:#a89f8f;
    --red:#c0392b;
    --line:rgba(59,120,240,.25);
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Work Sans',sans-serif;padding-bottom:120px;}
  ::selection{background:var(--orange);color:#111;}

  @media (prefers-reduced-motion: no-preference){
    .item{opacity:0;transform:translateY(14px);animation:riseIn .5s ease forwards;}
    @keyframes riseIn{to{opacity:1;transform:translateY(0);}}

    .cat-head-row, .cat-sub{opacity:0;transform:translateY(8px);animation:riseIn .45s ease forwards;}

    @keyframes pop{
      0%{transform:scale(1);}
      40%{transform:scale(.88);}
      100%{transform:scale(1);}
    }
    .price-btn.flash{animation:pop .28s ease;}

    @keyframes cartPop{
      0%,100%{transform:scale(1);}
      40%{transform:scale(1.15);}
      70%{transform:scale(.95);}
    }
    .cart-fab.pop{animation:cartPop .3s ease;}
    .cart-count.pop{animation:cartPop .3s ease;}

    .drawer.open{transition:transform .32s cubic-bezier(.2,.8,.3,1);}

    .brand{animation:glowIn 1s ease;}
    @keyframes glowIn{from{opacity:0;letter-spacing:8px;}to{opacity:1;letter-spacing:3px;}}
  }

  /* subtle amp-grille texture background */
  body{
    background-image:
      radial-gradient(circle at 1px 1px, rgba(202,160,60,.05) 1px, transparent 1px);
    background-size:14px 14px;
  }

  a{color:inherit;}

  /* parallax depth background */
  .parallax-layer{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .orb{position:absolute;border-radius:50%;filter:blur(36px);opacity:.3;}
  .orb-a{width:220px;height:220px;background:radial-gradient(circle,var(--orange),transparent 70%);top:8%;left:-40px;}
  .orb-b{width:280px;height:280px;background:radial-gradient(circle,var(--gold),transparent 70%);top:45%;right:-80px;opacity:.22;}
  .orb-c{width:180px;height:180px;background:radial-gradient(circle,#f0960a,transparent 70%);bottom:6%;left:20%;opacity:.18;}
  header.top, nav.cats, main, footer, .drawer, .overlay, .cart-fab{position:relative;z-index:1;}

  header.top{
    position:sticky;top:0;z-index:31;
    background:var(--bg);
    padding:22px 18px 10px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-family:'Bebas Neue',sans-serif;
    font-size:44px;letter-spacing:3px;line-height:1;
    background:linear-gradient(180deg,var(--gold-bright),var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 18px rgba(255,140,26,.25);
  }
  .tagline{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);margin-top:2px;}
  .timing{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;
    font-size:11.5px;letter-spacing:.5px;color:var(--gold-bright);
  }
  .timing::before{content:'●';color:#5ec26a;font-size:8px;}

  nav.cats{
    position:sticky;top:0;z-index:29;
    display:flex;gap:8px;overflow-x:auto;
    padding:12px 14px;background:var(--bg);
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  nav.cats::-webkit-scrollbar{display:none;}
  nav.cats button{
    flex:none;
    background:var(--bg-alt);color:var(--dim);
    border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;font-family:'Oswald',sans-serif;font-size:12.5px;
    letter-spacing:1px;text-transform:uppercase;cursor:pointer;
    transition:background .28s ease, color .28s ease, border-color .28s ease, transform .15s ease;
  }
  nav.cats button:active{transform:scale(.93);}
  nav.cats button.active{
    background:linear-gradient(135deg,var(--orange),#c97600);
    color:#111;border-color:transparent;font-weight:600;
  }

  section.cat-section{padding-top:26px;scroll-margin-top:var(--sticky-offset, 170px);}
  .cat-head-row{display:flex;align-items:center;gap:12px;}
  .cat-icon{
    width:46px;height:46px;flex:none;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(155deg,#232326,#141416 60%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 6px 14px rgba(0,0,0,.45), 0 0 0 1px var(--line);
  }
  .cat-icon svg{width:26px;height:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
  .cat-heading{
    font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;
    color:var(--gold-bright);margin:0;
  }
  .cat-sub{height:2px;width:44px;background:var(--orange);border-radius:2px;margin:8px 0 14px 58px;}

  main{max-width:640px;margin:0 auto;padding:8px 14px 0;}

  .item{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px 14px;margin-bottom:10px;
  }
  .item-name{font-weight:600;font-size:15px;color:var(--cream);}
  .item-note{font-size:11.5px;color:var(--dim);margin-top:2px;}
  .price-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .price-btn{
    background:var(--bg-alt);border:1px solid var(--line);color:var(--gold-bright);
    border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;
    display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:64px;
    transition:transform .12s, background .15s;
  }
  .price-btn small{color:var(--dim);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.5px;}
  .price-btn:active{transform:scale(.94);}
  .price-btn.flash{background:var(--orange);color:#111;border-color:var(--orange);}
  .price-btn.flash small{color:#3a2200;}

  /* floating cart */
  .cart-fab{
    position:fixed;right:18px;bottom:18px;z-index:50;
    width:60px;height:60px;border-radius:50%;
    background:var(--orange);
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);cursor:pointer;
  }
  .cart-fab .cart-glyph{width:26px;height:26px;color:#1a0e00;}
  .cart-count{
    position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;
    font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);
  }

  /* cart drawer */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;left:0;right:0;bottom:0;z-index:61;
    background:var(--bg-alt);border-top:1px solid var(--gold);
    border-radius:20px 20px 0 0;
    max-height:78vh;display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .28s ease;
    box-shadow:0 -10px 40px rgba(0,0,0,.6);
  }
  .drawer.open{transform:translateY(0);}
  .drawer-handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 4px;}
  .drawer-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 20px 12px;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1.5px;margin:0;color:var(--gold-bright);}
  .drawer-head button{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;}
  .drawer-list{overflow-y:auto;padding:10px 20px;flex:1;}
  .empty-cart{text-align:center;color:var(--dim);padding:40px 10px;font-size:14px;}
  .cart-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  .cart-row .ci-name{font-size:14px;font-weight:600;}
  .cart-row .ci-variant{font-size:11px;color:var(--dim);}
  .qty-ctrl{display:flex;align-items:center;gap:10px;}
  .qty-ctrl button{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    background:var(--card);color:var(--gold-bright);font-size:16px;cursor:pointer;line-height:1;
  }
  .ci-price{min-width:56px;text-align:right;font-weight:700;color:var(--gold-bright);font-size:14px;}
  .drawer-foot{padding:16px 20px 22px;border-top:1px solid var(--line);}
  .total-row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:12px;}
  .total-row b{font-family:'Oswald',sans-serif;font-size:20px;color:var(--orange);}
  .name-input{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--cream);font-size:14px;margin-bottom:10px;
  }
  .name-input::placeholder{color:var(--dim);}
  .order-btn{
    width:100%;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#33c463,#219150);
    color:#fff;font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;
    letter-spacing:.5px;cursor:pointer;
  }
  .order-btn:disabled{opacity:.4;}

  .bill-badge{
    display:none;margin-top:12px;text-align:center;
    border:1px dashed var(--gold);border-radius:10px;
    padding:10px 12px;color:var(--gold-bright);
    font-family:'Oswald',sans-serif;letter-spacing:.5px;font-size:13.5px;
  }
  .bill-badge b{color:var(--orange);font-size:16px;letter-spacing:1px;}
  @media (prefers-reduced-motion: no-preference){
    @keyframes stampIn{
      0%{opacity:0;transform:scale(1.4) rotate(-6deg);}
      60%{opacity:1;transform:scale(.96) rotate(1deg);}
      100%{transform:scale(1) rotate(0);}
    }
    .bill-badge.show{animation:stampIn .38s ease;}
  }

  footer{
    text-align:center;padding:34px 20px 10px;color:var(--dim);font-size:11.5px;letter-spacing:.5px;
  }

  /* staff toggle + dashboard */
  .staff-toggle{display:none;}
  /* splash intro */
  #splash{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .5s ease, visibility .5s;
  }
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none;}

  #splash .logo-stage{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center;}
  #splash .logo-ring{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid var(--gold);opacity:0;
    animation:ringPulse 1.8s ease-out infinite;
  }
  #splash .logo-ring.r2{animation-delay:.6s;}
  @keyframes ringPulse{
    0%{transform:scale(.7);opacity:.5;}
    100%{transform:scale(1.6);opacity:0;}
  }
  #splash .logo-img{
    width:150px;height:150px;border-radius:50%;
    box-shadow:0 0 40px rgba(255,140,26,.35), 0 10px 30px rgba(0,0,0,.5);
    opacity:0;transform:scale(.7);
    animation:logoPop 1s cubic-bezier(.2,.9,.3,1.3) forwards .2s;
  }
  @keyframes logoPop{
    0%{opacity:0;transform:scale(.6) rotate(-8deg);}
    60%{opacity:1;}
    100%{opacity:1;transform:scale(1) rotate(0);}
  }
  #splash .splash-tag{
    margin-top:18px;font-family:'Oswald',sans-serif;font-size:11.5px;
    letter-spacing:4px;text-transform:uppercase;color:var(--dim);
    opacity:0;animation:tagFadeIn .6s ease forwards 1s;
  }
  @keyframes tagFadeIn{to{opacity:1;}}

  /* toast notifications */
  #toastWrap{
    position:fixed;left:0;right:0;bottom:96px;z-index:80;
    display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  }
  .toast{
    background:var(--card);border:1px solid var(--gold);color:var(--cream);
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;
    box-shadow:var(--shadow);opacity:0;transform:translateY(14px);
    animation:toastIn .35s ease forwards, toastOut .35s ease forwards 1.8s;
  }
  @keyframes toastIn{to{opacity:1;transform:translateY(0);}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-10px);}}

  /* soft pop on item cards */
  .item{transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;}
  .item.popping{transform:scale(.97);box-shadow:0 4px 14px rgba(0,0,0,.35);}

  /* skeleton shimmer while menu builds */
  .skel{
    background:linear-gradient(90deg, var(--card) 25%, #232326 37%, var(--card) 63%);
    background-size:400% 100%;animation:shimmer 1.3s ease infinite;
    border-radius:14px;height:64px;margin-bottom:10px;
  }
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
</style>
</head>

// ---------- STATE ----------
let cart = {}; // key -> {name, variant, price, qty}
// WhatsApp checkout removed — orders now go straight to Firestore/staff dashboard

// ---------- RENDER MENU + NAV ----------
const menuEl = document.getElementById('menu');
const navEl = document.getElementById('catNav');

MENU.forEach((section, si) => {
  const btn = document.createElement('button');
  btn.textContent = section.cat;
  btn.dataset.idx = si;
  if(si===0) btn.classList.add('active');
  btn.onclick = () => {
    document.getElementById('sec-'+si).scrollIntoView({behavior:'smooth', block:'start'});
  };
  navEl.appendChild(btn);

  const sec = document.createElement('section');
  sec.className = 'cat-section';
  sec.id = 'sec-'+si;
  const iconSvg = ICONS[section.cat] || '';
  sec.innerHTML = `<div class="cat-head-row"><div class="cat-icon">${iconSvg}</div><div class="cat-heading">${section.cat}</div></div><div class="cat-sub"></div>`;

  section.items.forEach((item, ii) => {
    const row = document.createElement('div');
    row.className = 'item';
    row.style.animationDelay = Math.min(ii*45, 360) + 'ms';
    const priceButtons = item.prices.map((p,pi) => {
      const key = item.name + '|' + (p.label||'');
      return `<button class="price-btn" data-key="${escapeAttr(key)}" data-name="${escapeAttr(item.name)}" data-variant="${escapeAttr(p.label||'')}" data-price="${p.price}">
        ${p.label ? `<small>${p.label}</small>` : ''}₹${p.price}
      </button>`;
    }).join('');
    row.innerHTML = `
      <div style="flex:1">
        <div class="item-name">${item.name}</div>
        <div class="price-row">${priceButtons}</div>
      </div>`;
    sec.appendChild(row);
  });

  menuEl.appendChild(sec);
});

function escapeAttr(str){ return String(str).replace(/"/g,'&quot;'); }

// keep the category tabs stuck exactly where the header ends — no hardcoded guess,
// so they can never overlap or leave a seam regardless of text length/font load
const headerEl = document.querySelector('header.top');
let stickyThreshold = 190;
function syncHeaderHeight(){
  const h = headerEl.getBoundingClientRect().height;
  navEl.style.top = h + 'px';
  stickyThreshold = h + navEl.getBoundingClientRect().height;
  document.documentElement.style.setProperty('--sticky-offset', stickyThreshold + 'px');
}
syncHeaderHeight();
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('load', syncHeaderHeight); // re-check once fonts finish loading

// highlight active nav on scroll
const sections = MENU.map((_,i)=>document.getElementById('sec-'+i));
window.addEventListener('scroll', () => {
  let idx = 0;
  sections.forEach((sec,i) => { if(sec.getBoundingClientRect().top < stickyThreshold) idx = i; });
  [...navEl.children].forEach((b,i) => b.classList.toggle('active', i===idx));
}, {passive:true});

// ---------- CART LOGIC ----------
menuEl.addEventListener('click', (e) => {
  const b = e.target.closest('.price-btn');
  if(!b) return;
  const key = b.dataset.key;
  if(!cart[key]){
    cart[key] = {name:b.dataset.name, variant:b.dataset.variant, price:Number(b.dataset.price), qty:0};
  }
  cart[key].qty += 1;
  b.classList.add('flash');
  setTimeout(()=>b.classList.remove('flash'), 280);
  cartFab.classList.remove('pop'); void cartFab.offsetWidth; cartFab.classList.add('pop');
  cartCount.classList.remove('pop'); void cartCount.offsetWidth; cartCount.classList.add('pop');
  updateCartUI();
});

const cartFab = document.getElementById('cartFab');
const cartCount = document.getElementById('cartCount');
const overlay = document.getElementById('overlay');
const drawer = document.getElementById('drawer');
const drawerList = document.getElementById('drawerList');
const totalAmt = document.getElementById('totalAmt');
const orderBtn = document.getElementById('orderBtn');
const tableInput = document.getElementById('tableInput');
const billBadge = document.getElementById('billBadge');

function genBillNo(){
  const now = new Date();
  const datePart = String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
  const randPart = Math.floor(100 + Math.random()*900); // 3-digit
  return `RO-${datePart}-${randPart}`;
}

function cartArray(){ return Object.entries(cart).map(([key,v]) => ({key,...v})).filter(i=>i.qty>0); }

function updateCartUI(){
  const items = cartArray();
  const count = items.reduce((a,i)=>a+i.qty,0);
  const total = items.reduce((a,i)=>a+i.qty*i.price,0);

  cartCount.style.display = count>0 ? 'flex' : 'none';
  cartCount.textContent = count;

  totalAmt.textContent = '₹'+total;
  orderBtn.disabled = count===0;

  if(items.length===0){
    drawerList.innerHTML = '<div class="empty-cart">Nothing here yet.<br>Tap any price to add it to your order.</div>';
    return;
  }
  drawerList.innerHTML = items.map(i => `
    <div class="cart-row" data-key="${escapeAttr(i.key)}">
      <div>
        <div class="ci-name">${i.name}</div>
        ${i.variant ? `<div class="ci-variant">${i.variant}</div>` : ''}
      </div>
      <div class="qty-ctrl">
        <button data-act="dec">–</button>
        <span>${i.qty}</span>
        <button data-act="inc">+</button>
      </div>
      <div class="ci-price">₹${i.qty*i.price}</div>
    </div>
  `).join('');
}

drawerList.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if(!b) return;
  const key = b.closest('.cart-row').dataset.key;
  if(b.dataset.act==='inc') cart[key].qty += 1;
  else { cart[key].qty -= 1; if(cart[key].qty<=0) delete cart[key]; }
  updateCartUI();
});

function openDrawer(){ overlay.classList.add('open'); drawer.classList.add('open'); }
function closeDrawer(){ overlay.classList.remove('open'); drawer.classList.remove('open'); }
cartFab.onclick = openDrawer;
overlay.onclick = closeDrawer;
document.getElementById('closeDrawer').onclick = closeDrawer;

// shared bridge key — the staff dashboard file reads from this same key
// writes each order to Firestore so the staff dashboard sees it live, on any device
function saveOrderToBridge(order){
  try{
    const { db, collection, addDoc } = window.__fb;
    addDoc(collection(db, 'orders'), order).catch(err => console.error('Order sync failed:', err));
  }catch(e){ console.error('Firebase not ready:', e); }
}

const WHATSAPP_NUMBER = "919259001370";

orderBtn.onclick = () => {
  const items = cartArray();
  if(items.length===0) return;
  const who = tableInput.value.trim();
  const billNo = genBillNo();
  const total = items.reduce((a,i)=>a+i.qty*i.price,0);

  saveOrderToBridge({
    billNo, who: who || '—',
    items: items.map(i => ({name:i.name, variant:i.variant, qty:i.qty, price:i.price})),
    total, time: Date.now(), status: 'new'
  });

  let msg = `New order — Rock On Café\n`;
  msg += `Bill No: ${billNo}\n`;
  if(who) msg += `From: ${who}\n`;
  msg += `\n`;
  items.forEach(i => {
    msg += `• ${i.name}${i.variant? ' ('+i.variant+')':''} x${i.qty} — ₹${i.qty*i.price}\n`;
  });
  msg += `\nTotal: ₹${total}`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;

  billBadge.innerHTML = `Bill No. <b>${billNo}</b><br>Sent to the counter on WhatsApp`;
  billBadge.style.display = 'block';
  billBadge.classList.remove('show'); void billBadge.offsetWidth; billBadge.classList.add('show');
  showToast(`Order placed — ${billNo}`);

  cart = {};
  updateCartUI();

  window.open(url, '_blank');
};

// Background orbs stay fixed in place (no scroll-linked JS) — the blur + fixed
// positioning alone gives the depth look, and this avoids the per-frame repaint
// cost that was causing a visible glitch line on some phones while scrolling.

// ---------- SPLASH ----------
window.addEventListener('load', () => {
  setTimeout(() => { document.getElementById('splash').classList.add('hide'); }, 2000);
});

// ---------- TOASTS ----------
const toastWrap = document.getElementById('toastWrap');
function showToast(text){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  toastWrap.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

// ---------- SOFT POP ON MENU CARDS ----------
menuEl.addEventListener('pointerdown', (e) => {
  const card = e.target.closest('.item');
  if(!card) return;
  card.classList.add('popping');
});
function endPop(e){
  const card = e.target.closest && e.target.closest('.item');
  if(card) card.classList.remove('popping');
}
menuEl.addEventListener('pointerup', endPop);
menuEl.addEventListener('pointerleave', endPop, true);

updateCartUI();
</script>
</body>
</html>

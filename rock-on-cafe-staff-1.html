<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock On Café — Staff Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c; --bg-alt:#151517; --card:#1a1a1d;
    --gold:#3b78f0; --gold-bright:#7aa4ff; --orange:#f0960a;
    --cream:#f4ecdb; --dim:#a89f8f; --red:#c0392b;
    --line:rgba(59,120,240,.25);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Work Sans',sans-serif;min-height:100vh;}

  /* splash intro */
  #splash{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .5s ease, visibility .5s;
  }
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
  #splash .logo-stage{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center;}
  #splash .logo-ring{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid var(--gold);opacity:0;
    animation:ringPulse 1.8s ease-out infinite;
  }
  #splash .logo-ring.r2{animation-delay:.6s;}
  @keyframes ringPulse{
    0%{transform:scale(.7);opacity:.5;}
    100%{transform:scale(1.6);opacity:0;}
  }
  #splash .logo-img{
    width:150px;height:150px;border-radius:50%;
    box-shadow:0 0 40px rgba(240,150,10,.35), 0 10px 30px rgba(0,0,0,.5);
    opacity:0;transform:scale(.7);
    animation:logoPop 1s cubic-bezier(.2,.9,.3,1.3) forwards .2s;
  }
  @keyframes logoPop{
    0%{opacity:0;transform:scale(.6) rotate(-8deg);}
    60%{opacity:1;}
    100%{opacity:1;transform:scale(1) rotate(0);}
  }
  #splash .splash-tag{
    margin-top:18px;font-family:'Oswald',sans-serif;font-size:11.5px;
    letter-spacing:4px;text-transform:uppercase;color:var(--dim);
    opacity:0;animation:tagFadeIn .6s ease forwards 1s;
  }
  @keyframes tagFadeIn{to{opacity:1;}}

  @media (prefers-reduced-motion: no-preference){
    @keyframes springIn{
      0%{opacity:0;transform:translateY(18px) scale(.96);}
      60%{opacity:1;transform:translateY(-3px) scale(1.01);}
      100%{transform:translateY(0) scale(1);}
    }
    .order-card{animation:springIn .4s cubic-bezier(.2,.9,.3,1.2);}

    @keyframes barGrow{from{height:0 !important;}}
    .chart-fill{animation:barGrow .6s cubic-bezier(.2,.8,.3,1);}

    @keyframes tabPulse{
      0%,100%{box-shadow:0 0 0 0 rgba(255,140,26,.5);}
      50%{box-shadow:0 0 0 6px rgba(255,140,26,0);}
    }
    .tab-btn.pulse{animation:tabPulse 1.2s ease-out 2;}

    @keyframes countTick{
      0%{transform:translateY(-6px);opacity:0;}
      100%{transform:translateY(0);opacity:1;}
    }
    .stat-card .num.tick{animation:countTick .3s ease;}
  }

  header.top{
    padding:22px 18px 14px;text-align:center;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:10;
  }
  .brand{
    font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:3px;line-height:1;
    background:linear-gradient(180deg,var(--gold-bright),var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .subtitle{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);margin-top:4px;}

  /* PIN lock screen */
  #lockScreen{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:70vh;padding:20px;text-align:center;
  }
  #lockScreen .lock-icon{font-size:34px;margin-bottom:10px;}
  #lockScreen p{color:var(--dim);font-size:13px;max-width:280px;margin:4px 0 20px;}
  #pinInput{
    width:180px;text-align:center;letter-spacing:10px;font-size:22px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    color:var(--cream);padding:12px;font-family:'Oswald',sans-serif;
  }
  #pinInput:focus{outline:none;border-color:var(--gold);}
  #unlockBtn{
    margin-top:14px;padding:12px 30px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--orange),#c97600);
    color:#111;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
  }
  #pinError{color:var(--red);font-size:12px;margin-top:10px;height:14px;}
  @keyframes shake{
    0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);}
  }
  #pinInput.shake{animation:shake .3s ease;}

  /* dashboard */
  #dashboard{display:none;}
  .dash-wrap{max-width:640px;margin:0 auto;padding:18px 14px 40px;}
  .dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;}
  .stat-card .num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--orange);letter-spacing:1px;}
  .stat-card .lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .dash-section-title{
    display:flex;justify-content:space-between;align-items:center;
    font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;
    color:var(--gold-bright);margin-bottom:12px;
  }
  .refresh-note{font-size:10.5px;color:var(--dim);font-family:'Work Sans',sans-serif;letter-spacing:0;text-transform:none;}
  .dash-empty{text-align:center;color:var(--dim);padding:50px 10px;font-size:14px;line-height:1.6;}
  .order-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .order-card.status-new{border-color:var(--orange);}
  .order-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .order-bill{font-family:'Oswald',sans-serif;font-size:14px;color:var(--gold-bright);font-weight:600;}
  .order-who{font-size:11px;color:var(--dim);margin-top:1px;}
  .order-time{font-size:10.5px;color:var(--dim);}
  .order-items{font-size:12.5px;color:var(--cream);line-height:1.6;margin:8px 0;}
  .order-total-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .order-total{font-family:'Oswald',sans-serif;font-size:15px;color:var(--orange);font-weight:600;}
  .status-pill{font-size:10.5px;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .status-new .status-pill{background:#3a2a16;color:var(--orange);}
  .status-preparing .status-pill{background:#2a3a4a;color:#6cb4ff;}
  .status-ready .status-pill{background:#1f3a26;color:#5ec26a;}
  .status-completed .status-pill{background:#2a2a2a;color:var(--dim);}
  .status-btn{
    background:var(--bg-alt);border:1px solid var(--line);color:var(--cream);
    padding:7px 12px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .lock-btn{
    position:fixed;bottom:16px;right:16px;background:var(--bg-alt);border:1px solid var(--line);
    color:var(--dim);width:38px;height:38px;border-radius:10px;font-size:15px;cursor:pointer;
  }

  .tab-row{display:flex;gap:8px;margin-bottom:18px;}
  .tab-btn{
    flex:1;background:var(--bg-alt);border:1px solid var(--line);color:var(--dim);
    padding:10px;border-radius:11px;font-family:'Oswald',sans-serif;font-size:12.5px;
    letter-spacing:.5px;cursor:pointer;
  }
  .tab-btn.active{background:linear-gradient(135deg,var(--orange),#c97600);color:#111;font-weight:600;border-color:transparent;}

  .period-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
  .period-btn{
    flex:none;background:var(--card);border:1px solid var(--line);color:var(--dim);
    padding:7px 14px;border-radius:999px;font-size:12px;font-family:'Oswald',sans-serif;
    letter-spacing:.4px;cursor:pointer;
  }
  .period-btn.active{background:var(--gold);color:#1a1200;border-color:transparent;font-weight:600;}

  .bill-row{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;margin-bottom:8px;
  }
  .bill-row .bl-no{font-family:'Oswald',sans-serif;font-size:13px;color:var(--gold-bright);font-weight:600;}
  .bill-row .bl-meta{font-size:10.5px;color:var(--dim);margin-top:2px;}
  .bill-row .bl-amt{font-family:'Oswald',sans-serif;font-size:14px;color:var(--orange);font-weight:600;}

  .chart-wrap{display:flex;gap:9px;overflow-x:auto;padding:8px 2px 6px;margin-bottom:6px;}
  .chart-col{display:flex;flex-direction:column;align-items:center;flex:none;width:30px;}
  .chart-val{font-size:8.5px;color:var(--dim);margin-bottom:4px;height:11px;white-space:nowrap;}
  .chart-track{
    width:100%;height:110px;display:flex;align-items:flex-end;
    background:rgba(255,255,255,.04);border-radius:6px;overflow:hidden;
  }
  .chart-fill{
    width:100%;min-height:2px;border-radius:6px 6px 0 0;
    background:linear-gradient(180deg,var(--gold-bright),var(--orange));
    transition:height .5s ease;
  }
  .chart-lbl{font-size:8.5px;color:var(--dim);margin-top:6px;white-space:nowrap;}
</style>
</head>

<script>
// ---------- SPLASH ----------
setTimeout(() => {
  const s = document.getElementById('splash');
  if(s) s.classList.add('hide');
}, 2000);

// ---------------------------------------------------------------
// Change this PIN to whatever the café wants. This is a basic
// deterrent against customers stumbling onto this page — NOT real
// security. Anyone with the file/URL and a bit of patience could
// still get in. For real access control, this needs a proper login
// once it's wired to a backend (Firebase Auth etc.).
// ---------------------------------------------------------------
const STAFF_PIN = "1234";

const lockScreen = document.getElementById('lockScreen');
const dashboard = document.getElementById('dashboard');
const pinInput = document.getElementById('pinInput');
const pinError = document.getElementById('pinError');
const unlockBtn = document.getElementById('unlockBtn');
const lockBtn = document.getElementById('lockBtn');
const dashStats = document.getElementById('dashStats');
const dashOrders = document.getElementById('dashOrders');
const refreshNote = document.getElementById('refreshNote');
const tabOrders = document.getElementById('tabOrders');
const tabReports = document.getElementById('tabReports');
const ordersPane = document.getElementById('ordersPane');
const reportsPane = document.getElementById('reportsPane');
const reportStats = document.getElementById('reportStats');
const reportCount = document.getElementById('reportCount');
const billList = document.getElementById('billList');
const chartWrap = document.getElementById('chartWrap');
let activeTab = 'orders';
let activePeriod = 'today';
let ordersCache = [];
let listenerAttached = false;

function attachOrdersListener(){
  if(listenerAttached) return;
  listenerAttached = true;
  const { db, collection, query, orderBy, onSnapshot } = window.__fb;
  const q = query(collection(db, 'orders'), orderBy('time', 'desc'));
  onSnapshot(q, (snapshot) => {
    ordersCache = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    refreshNote.textContent = '(live)';
    renderActive();
  }, (err) => {
    console.error('Live order sync error:', err);
    refreshNote.textContent = '(sync error — check connection)';
  });
}

function tryUnlock(){
  if(pinInput.value === STAFF_PIN){
    lockScreen.style.display = 'none';
    dashboard.style.display = 'block';
    attachOrdersListener();
    renderActive();
  } else {
    pinError.textContent = 'Incorrect PIN';
    pinInput.classList.remove('shake'); void pinInput.offsetWidth; pinInput.classList.add('shake');
    pinInput.value = '';
  }
}
unlockBtn.onclick = tryUnlock;
pinInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });
lockBtn.onclick = () => {
  dashboard.style.display = 'none';
  lockScreen.style.display = 'flex';
  pinInput.value = ''; pinError.textContent = '';
};

const STATUS_FLOW = {new:'preparing', preparing:'ready', ready:'completed'};
const STATUS_LABEL = {new:'New', preparing:'Preparing', ready:'Ready', completed:'Completed'};
const STATUS_NEXT_LABEL = {new:'Start Preparing', preparing:'Mark Ready', ready:'Mark Completed'};

function loadOrders(){
  return ordersCache;
}
function timeAgo(ts){
  const mins = Math.max(0, Math.round((Date.now()-ts)/60000));
  if(mins<1) return 'just now';
  if(mins<60) return mins+'m ago';
  return Math.floor(mins/60)+'h '+(mins%60)+'m ago';
}

function renderDashboard(){
  const orders = loadOrders();
  const totalOrders = orders.length;
  const totalRevenue = orders.reduce((a,o)=>a+o.total,0);
  const itemCounts = {};
  orders.forEach(o => o.items.forEach(i => { itemCounts[i.name] = (itemCounts[i.name]||0)+i.qty; }));
  let topItem = '—', topQty = 0;
  Object.entries(itemCounts).forEach(([name,qty]) => { if(qty>topQty){topQty=qty;topItem=name;} });

  dashStats.innerHTML = `
    <div class="stat-card"><div class="num">${totalOrders}</div><div class="lbl">Orders</div></div>
    <div class="stat-card"><div class="num">₹${totalRevenue}</div><div class="lbl">Revenue</div></div>
    <div class="stat-card"><div class="num" style="font-size:16px">${topItem}</div><div class="lbl">Top Item</div></div>
  `;

  if(orders.length===0){
    dashOrders.innerHTML = '<div class="dash-empty">No orders yet.<br>Orders placed from the menu page (same browser) will appear here.</div>';
    return;
  }

  dashOrders.innerHTML = orders.map((o,idx) => `
    <div class="order-card status-${o.status}" data-idx="${idx}">
      <div class="order-card-head">
        <div>
          <div class="order-bill">${o.billNo}</div>
          <div class="order-who">${o.who}</div>
        </div>
        <div style="text-align:right">
          <span class="status-pill">${STATUS_LABEL[o.status]}</span>
          <div class="order-time">${timeAgo(o.time)}</div>
        </div>
      </div>
      <div class="order-items">${o.items.map(i => `${i.name}${i.variant?' ('+i.variant+')':''} × ${i.qty}`).join('<br>')}</div>
      <div class="order-total-row">
        <div class="order-total">₹${o.total}</div>
        ${o.status!=='completed' ? `<button class="status-btn" data-act="advance">${STATUS_NEXT_LABEL[o.status]}</button>` : ''}
      </div>
    </div>
  `).join('');
}

dashOrders.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act="advance"]');
  if(!b) return;
  const idx = Number(b.closest('.order-card').dataset.idx);
  const order = ordersCache[idx];
  if(order && STATUS_FLOW[order.status]){
    const { db, doc, updateDoc } = window.__fb;
    updateDoc(doc(db, 'orders', order.id), { status: STATUS_FLOW[order.status] })
      .catch(err => console.error('Status update failed:', err));
    // onSnapshot will re-render automatically once the write lands
  }
});

// ---------- TAB SWITCHING ----------
function setTab(tab){
  activeTab = tab;
  tabOrders.classList.toggle('active', tab==='orders');
  tabReports.classList.toggle('active', tab==='reports');
  ordersPane.style.display = tab==='orders' ? '' : 'none';
  reportsPane.style.display = tab==='reports' ? '' : 'none';
  renderActive();
}
tabOrders.onclick = () => setTab('orders');
tabReports.onclick = () => setTab('reports');

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.onclick = () => {
    activePeriod = btn.dataset.period;
    document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('active', b===btn));
    renderReports();
  };
});

function renderActive(){
  if(activeTab === 'orders') renderDashboard();
  else renderReports();
}

// ---------- REPORTS ----------
function filterByPeriod(orders, period){
  const now = new Date();
  return orders.filter(o => {
    const d = new Date(o.time);
    if(period === 'today'){
      return d.toDateString() === now.toDateString();
    }
    if(period === 'month'){
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }
    if(period === 'year'){
      return d.getFullYear() === now.getFullYear();
    }
    return true; // all
  });
}

function renderReports(){
  const all = loadOrders();
  const filtered = filterByPeriod(all, activePeriod);

  const totalOrders = filtered.length;
  const totalRevenue = filtered.reduce((a,o)=>a+o.total,0);
  const avgOrder = totalOrders ? Math.round(totalRevenue/totalOrders) : 0;

  reportStats.innerHTML = `
    <div class="stat-card"><div class="num">${totalOrders}</div><div class="lbl">Orders</div></div>
    <div class="stat-card"><div class="num">₹${totalRevenue}</div><div class="lbl">Revenue</div></div>
    <div class="stat-card"><div class="num">₹${avgOrder}</div><div class="lbl">Avg / Order</div></div>
  `;
  reportCount.textContent = `(${totalOrders})`;
  renderChart(activePeriod);

  if(filtered.length===0){
    billList.innerHTML = '<div class="dash-empty">No bills in this period yet.</div>';
    return;
  }

  billList.innerHTML = filtered.map(o => {
    const d = new Date(o.time);
    const dateStr = d.toLocaleDateString('en-IN', {day:'2-digit', month:'short'}) + ' · ' + d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
    const itemCount = o.items.reduce((a,i)=>a+i.qty,0);
    return `
      <div class="bill-row">
        <div>
          <div class="bl-no">${o.billNo}</div>
          <div class="bl-meta">${dateStr} · ${itemCount} item${itemCount!==1?'s':''} · ${o.who}</div>
        </div>
        <div class="bl-amt">₹${o.total}</div>
      </div>
    `;
  }).join('');
}

// ---------- REVENUE CHART ----------
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function renderChart(period){
  const all = loadOrders();
  const now = new Date();
  let labels = [], values = [];

  if(period === 'today'){
    const buckets = [[7,10,'7–10am'],[10,13,'10–1pm'],[13,16,'1–4pm'],[16,19,'4–7pm'],[19,22,'7–10pm']];
    labels = buckets.map(b => b[2]);
    values = buckets.map(() => 0);
    all.forEach(o => {
      const d = new Date(o.time);
      if(d.toDateString() !== now.toDateString()) return;
      const h = d.getHours();
      buckets.forEach((b,i) => { if(h >= b[0] && h < b[1]) values[i] += o.total; });
    });
  } else if(period === 'month'){
    const days = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    labels = Array.from({length:days}, (_,i) => String(i+1));
    values = new Array(days).fill(0);
    all.forEach(o => {
      const d = new Date(o.time);
      if(d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear()) return;
      values[d.getDate()-1] += o.total;
    });
  } else if(period === 'year'){
    labels = MONTH_NAMES.slice();
    values = new Array(12).fill(0);
    all.forEach(o => {
      const d = new Date(o.time);
      if(d.getFullYear() !== now.getFullYear()) return;
      values[d.getMonth()] += o.total;
    });
  } else { // all time — group by month across every year present
    const map = {};
    all.forEach(o => {
      const d = new Date(o.time);
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      map[key] = (map[key]||0) + o.total;
    });
    const keys = Object.keys(map).sort();
    labels = keys.map(k => { const [y,m] = k.split('-'); return MONTH_NAMES[Number(m)-1] + ' ' + y.slice(2); });
    values = keys.map(k => map[k]);
  }

  if(values.length === 0 || values.every(v => v === 0)){
    chartWrap.innerHTML = '<div class="dash-empty" style="width:100%">No revenue data for this period yet.</div>';
    return;
  }

  const max = Math.max(...values, 1);
  chartWrap.innerHTML = values.map((v,i) => {
    const pct = v > 0 ? Math.max(6, Math.round(v/max*100)) : 3;
    return `<div class="chart-col">
      <div class="chart-val">${v>0 ? '₹'+v : ''}</div>
      <div class="chart-track"><div class="chart-fill" style="height:${pct}%"></div></div>
      <div class="chart-lbl">${labels[i]}</div>
    </div>`;
  }).join('');
}
